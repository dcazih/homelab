services:
  cassette-web:
    build: ./cassette-web
    image: cassette-web:local
    container_name: music-cassette-web
    environment:
      BRIDGE_URL: http://music-profiles:8765
      CASSETTE_URL: http://cassette-proxy:8787
      SESSION_KEY_FILE: /data/session.key
    ports:
      - '127.0.0.1:8790:8790'
    volumes:
      - cassette-web-state:/data
    networks:
      - music-request
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  cassette-web-state:
