# TrueNAS SCALE deployment. Source remains in the homelab Git checkout.
# State and media are host paths so Apps can be recreated without losing data.
name: homelab-music
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    cap_add: [NET_ADMIN]
    devices: ['/dev/net/tun:/dev/net/tun']
    env_file: /mnt/Pool/music-server/private/vpn.env
    environment:
      VPN_SERVICE_PROVIDER: airvpn
      VPN_TYPE: wireguard
      FIREWALL_VPN_INPUT_PORTS: '32740'
      FIREWALL_INPUT_PORTS: '5030'
    ports:
      - '192.168.1.152:5030:5030/tcp'
    restart: unless-stopped

  slskd:
    image: slskd/slskd:0.26.2
    user: '3000:3000'
    network_mode: 'service:gluetun'
    depends_on: [gluetun]
    volumes:
      - /mnt/Pool/music-server/state/slskd:/app
      - /mnt/Pool/music-server/media:/media
    restart: unless-stopped

  droppedneedle:
    image: droppedneedle/droppedneedle:latest
    environment:
      PUID: '3000'
      PGID: '3000'
      TZ: America/Denver
      PORT: '8688'
      SLSKD_DOWNLOADS_PATH: /media/_automation/slskd-downloads
    volumes:
      - /mnt/Pool/music-server/state/droppedneedle/config:/app/config
      - /mnt/Pool/music-server/state/droppedneedle/cache:/app/cache
      - /mnt/Pool/music-server/media:/media
      - /mnt/Pool/music-server/source/.cassette-event-sync/plugin:/app/plugins/cassette-profile-events:ro
    ports:
      - '192.168.1.152:8688:8688'
    depends_on: [gluetun]
    restart: unless-stopped

  music-profiles:
    build: /mnt/Pool/music-server/source/profiles
    image: homelab/music-profiles:nas-posix
    user: '3000:3000'
    env_file: /mnt/Pool/music-server/private/bridge.env
    environment:
      NAVIDROME_URL: http://192.168.1.152:4533
      DROPPEDNEEDLE_URL: http://192.168.1.152:8688
      PROFILE_DB: /data/profiles.db
      PEER_SCHEDULER_DB: /data/peer_scheduler.sqlite
      BRIDGE_POLL_SECONDS: '90'
    volumes:
      - /mnt/Pool/music-server/state/profiles:/data
    ports:
      - '192.168.1.152:8765:8765'
    depends_on: [droppedneedle]
    restart: unless-stopped

  cassette-proxy:
    build: /mnt/Pool/music-server/source/cassette-proxy
    image: homelab/cassette-proxy:nas-posix
    user: '3000:3000'
    env_file: /mnt/Pool/music-server/private/proxy.env
    environment:
      NAVIDROME_UPSTREAM: http://192.168.1.152:4533
      CASSETTE_PERSONALIZATION_ENABLED: 'true'
      CASSETTE_STATE_DB: /data/cassette-state.sqlite
      CASSETTE_PERSONAL_CACHE_SECONDS: '0'
      DROPPEDNEEDLE_URL: http://droppedneedle:8688
      MUSIC_BRIDGE_URL: http://music-profiles:8765
    volumes:
      - /mnt/Pool/music-server/state/cassette-proxy:/data
    ports:
      - '192.168.1.152:8787:8787'
    depends_on: [music-profiles]
    restart: unless-stopped

  sona-aonsoku:
    build: /mnt/Pool/music-server/source/sona-aonsoku
    image: homelab/sona-aonsoku:nas
    environment:
      SERVER_URL: https://music.hippocampus-polaris.ts.net
      HIDE_SERVER: 'false'
      SERVER_TYPE: navidrome
      APP_AUTH_TYPE: token
      APP_THEME: sona-web
    ports:
      - '192.168.1.152:8791:8080'
    restart: unless-stopped

  muse-music:
    build: /mnt/Pool/music-server/source/muse-music-connector
    image: homelab/muse-music:nas-posix
    user: '3000:3000'
    env_file: /mnt/Pool/music-server/private/muse.env
    environment:
      BRIDGE_URL: http://music-profiles:8765
      STAGE2_DB: /data/stage2.sqlite3
      # Separate publicly reachable OAuth/MCP origin for Muse. Preserve
      # homelab:443 for the independent NAS admin gateway.
      STAGE2_PUBLIC_URL: https://homelab.hippocampus-polaris.ts.net:8443
    volumes:
      - /mnt/Pool/music-server/state/muse:/data
    ports:
      - '192.168.1.152:8788:8788'
    depends_on: [music-profiles]
    restart: unless-stopped

  cassette-event-sync:
    build: /mnt/Pool/music-server/source/.cassette-event-sync/worker
    image: homelab/cassette-event-sync:nas-posix
    user: '3000:3000'
    env_file: /mnt/Pool/music-server/private/event-sync.env
    volumes:
      - /mnt/Pool/music-server/state/event-sync:/state
    depends_on: [music-profiles]
    restart: unless-stopped
